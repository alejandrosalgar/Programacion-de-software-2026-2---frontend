<div class="app" [class.retraido]="retraido()">
  <aside class="sidebar">
    <div class="cabecera">
      <span class="logo">B</span>
      <span class="marca">Banco ITM</span>
      <button
        type="button"
        class="alternar"
        (click)="alternar()"
        [attr.aria-label]="retraido() ? 'Expandir menu' : 'Retraer menu'"
        [attr.aria-expanded]="!retraido()"
      >
        {{ retraido() ? '›' : '‹' }}
      </button>
    </div>

    <nav class="nav">
      @for (item of menu; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="activo" [attr.title]="item.etiqueta">
          <span class="sigla">{{ item.sigla }}</span>
          <span class="texto">{{ item.etiqueta }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
