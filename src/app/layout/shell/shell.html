<div class="aplicacion" [class.sidebar-contraida]="contraido()" [class.drawer-abierto]="drawerAbierto()">
  <aside class="sidebar" id="navegacion-principal" aria-label="Navegación principal">
    <div class="sidebar-cabecera">
      <a class="marca" routerLink="/usuarios" aria-label="Banco ITM, inicio" (click)="cerrarDrawer()">
        <span class="marca-simbolo" aria-hidden="true">BI</span>
        <span class="marca-texto">Banco ITM<small>Gestión bancaria</small></span>
      </a>
      <button
        class="boton-colapsar"
        type="button"
        [attr.aria-expanded]="!contraido()"
        aria-label="Contraer o expandir menú"
        title="Contraer o expandir menú"
        (click)="alternarSidebar()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
    </div>

    <nav class="navegacion">
      <span class="nav-titulo">Administración</span>
      @for (item of menu; track item.ruta) {
        <a
          class="enlace-nav"
          [routerLink]="item.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="contraido() ? item.etiqueta : null"
          [attr.aria-label]="contraido() ? item.etiqueta : null"
          (click)="cerrarDrawer()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            @switch (item.icono) {
              @case ('usuarios') { <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="10" cy="7" r="4" /><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /> }
              @case ('cuentas') { <rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 10h18M7 15h3" /> }
              @case ('cuotas') { <rect x="4" y="3" width="16" height="18" rx="2" /><path d="M8 7h8M8 11h8M8 15h3" /> }
              @case ('sucursales') { <path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h.01M15 10h.01M9 14h.01M15 14h.01M10 21v-4h4v4" /> }
              @case ('empleados') { <circle cx="12" cy="8" r="4" /><path d="M5 21v-2a7 7 0 0 1 14 0v2M12 12v4M9 14h6" /> }
              @case ('tarjetas') { <rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 10h18M7 15h4" /> }
              @case ('tipos-cuenta') { <circle cx="12" cy="12" r="9" /><path d="M16 8.5c-.7-.8-1.8-1.2-3-1.2-1.7 0-3 .8-3 2s1.2 1.8 3 2.2 3 1 3 2.3-1.3 2.2-3 2.2c-1.2 0-2.4-.5-3.1-1.3M13 5.5v13" /> }
              @case ('acciones') { <path d="M12 8v4l3 2M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5" /> }
            }
          </svg>
          <span class="nav-etiqueta">{{ item.etiqueta }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-pie"><span class="estado-conexion"></span><span class="pie-texto">Panel administrativo</span></div>
  </aside>

  <button class="fondo-drawer" type="button" aria-label="Cerrar menú" (click)="cerrarDrawer()"></button>

  <section class="area-principal">
    <div class="marca-agua" aria-hidden="true">
      <span class="marca-agua-logo">Banco ITM</span>
      <span class="marca-agua-frase">“Tus datos, nuestro compromiso; tu confianza, nuestra prioridad”</span>
    </div>

    <header class="barra-superior">
      <button
        class="boton-menu-movil"
        type="button"
        aria-label="Abrir menú de navegación"
        [attr.aria-expanded]="drawerAbierto()"
        aria-controls="navegacion-principal"
        (click)="alternarDrawer()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <div class="usuario-superior">
        <span class="avatar" aria-hidden="true">A</span>
        <span class="usuario-nombre">Administrador<small>Acceso local</small></span>
        <button class="boton-salir" type="button" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="mostrarAvisoSesion()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" /></svg>
          <span>Salir</span>
        </button>
      </div>
    </header>

    @if (avisoSesion()) {
      <div class="aviso-sesion" role="status" aria-live="polite">{{ avisoSesion() }}</div>
    }

    <main class="contenido"><router-outlet /></main>
  </section>
</div>
