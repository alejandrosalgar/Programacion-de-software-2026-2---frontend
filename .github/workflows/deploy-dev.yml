name: Deploy a Firebase al llegar a dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-firebase-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Tests, build y deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Bajar el codigo de dev
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para produccion
        run: npm run build

      - name: Leer el id del proyecto Firebase
        id: firebase_project
        run: |
          ID=$(node -e "process.stdout.write(require('./.firebaserc').projects.default)")
          if [ "$ID" = "TU_PROJECT_ID" ] || [ -z "$ID" ]; then
            echo "Cambia TU_PROJECT_ID en .firebaserc por el id real del proyecto Firebase."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Desplegar Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROGRAMACION_SOFTWARE_2026_2 }}
          projectId: ${{ steps.firebase_project.outputs.id }}
          channelId: live
          entryPoint: .
